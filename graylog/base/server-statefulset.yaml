# Graylog server. A StatefulSet (not a Deployment) because each node keeps
# state on disk: its node-id and the message journal (received messages not
# yet written to OpenSearch). Losing the journal loses logs.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: graylog
  labels:
    app: graylog
spec:
  serviceName: graylog-headless
  # Single node. Do NOT scale with HPA: a multi-node Graylog cluster needs
  # deliberate setup (one leader, load-balanced inputs, sized journals).
  replicas: 1
  selector:
    matchLabels:
      app: graylog
  template:
    metadata:
      labels:
        app: graylog
    spec:
      automountServiceAccountToken: false
      # Give Graylog time to flush its journal before it is killed.
      terminationGracePeriodSeconds: 120
      securityContext:
        # The image runs as user graylog (uid/gid 1100); make the volume writable.
        fsGroup: 1100
      containers:
        - name: graylog
          # Pin an exact release; bump deliberately and keep it equal to the
          # graylog-datanode image version (components/datanode).
          image: graylog/graylog:7.1.9
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 9000
            # Input ports. Graylog runs as non-root and cannot bind < 1024,
            # so syslog listens on 1514; the Service maps 514 -> 1514.
            # Inputs are NOT created automatically: add them in the UI
            # (System -> Inputs) on exactly these ports.
            - name: syslog-tcp
              containerPort: 1514
              protocol: TCP
            - name: syslog-udp
              containerPort: 1514
              protocol: UDP
            - name: gelf-tcp
              containerPort: 12201
              protocol: TCP
            - name: gelf-udp
              containerPort: 12201
              protocol: UDP
            - name: beats
              containerPort: 5044
              protocol: TCP
          envFrom:
            - configMapRef:
                name: graylog-config
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: MONGO_USER
              valueFrom:
                secretKeyRef:
                  name: graylog-mongodb
                  key: MONGODB_USERNAME
            - name: MONGO_PASS
              valueFrom:
                secretKeyRef:
                  name: graylog-mongodb
                  key: MONGODB_PASSWORD
            # $(VAR) expands only variables defined above or via envFrom.
            # Use a URL-safe password (letters/digits), or URL-encode it.
            - name: GRAYLOG_MONGODB_URI
              value: "mongodb://$(MONGO_USER):$(MONGO_PASS)@$(MONGODB_HOST):$(MONGODB_PORT)/$(MONGODB_DATABASE)?authSource=$(MONGODB_AUTH_SOURCE)"
            - name: GRAYLOG_PASSWORD_SECRET
              valueFrom:
                secretKeyRef:
                  name: graylog
                  key: GRAYLOG_PASSWORD_SECRET
            - name: GRAYLOG_ROOT_PASSWORD_SHA2
              valueFrom:
                secretKeyRef:
                  name: graylog
                  key: GRAYLOG_ROOT_PASSWORD_SHA2
            - name: GRAYLOG_NODE_ID_FILE
              value: /usr/share/graylog/data/data/node-id
            # Address that other Graylog nodes and Data Nodes use for this pod.
            - name: GRAYLOG_HTTP_PUBLISH_URI
              value: "http://$(POD_NAME).graylog-headless.$(POD_NAMESPACE).svc.cluster.local:9000/"
          # TCP probes: on first start Graylog serves a "preflight" setup UI
          # on port 9000, where /api/system/lbstatus does not exist yet.
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 120
            periodSeconds: 20
            failureThreshold: 6
          # The JVM heap is 1g by default (GRAYLOG_SERVER_JAVA_OPTS in the
          # image). Keep the memory limit about 2x the heap; raise both together.
          resources:
            requests:
              cpu: 500m
              memory: 1536Mi
            limits:
              memory: 2Gi
          volumeMounts:
            - name: data
              mountPath: /usr/share/graylog/data/data
              subPath: data
            - name: data
              mountPath: /usr/share/graylog/data/journal
              subPath: journal
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        # Change to your cluster's StorageClass if not local-path.
        storageClassName: local-path
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            # The journal is capped at 5GB by default (message_journal_max_size).
            storage: 10Gi
