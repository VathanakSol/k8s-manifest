apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: graylog-datanode
  labels:
    app: graylog-datanode
spec:
  serviceName: graylog-datanode-headless
  # One node keeps all indices on one disk. For more nodes, raise replicas
  # (each gets its own volume and joins the OpenSearch cluster) and set
  # index replicas in Graylog. Never autoscale this.
  replicas: 1
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: graylog-datanode
  template:
    metadata:
      labels:
        app: graylog-datanode
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 120
      initContainers:
        # OpenSearch refuses to start unless vm.max_map_count >= 262144.
        # This is a NODE-wide kernel setting and needs a privileged container;
        # if your Pod Security policy forbids it, set it on the worker nodes
        # instead (/etc/sysctl.d/) and delete this init container.
        - name: sysctl
          image: busybox:1.36
          command: ["sysctl", "-w", "vm.max_map_count=262144"]
          securityContext:
            privileged: true
            runAsUser: 0
      containers:
        - name: datanode
          # Must be the SAME version as the graylog/graylog server image.
          image: graylog/graylog-datanode:7.1.9
          imagePullPolicy: IfNotPresent
          ports:
            - name: api
              containerPort: 8999
            - name: opensearch
              containerPort: 9200
            - name: transport
              containerPort: 9300
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: MONGODB_HOST
              valueFrom:
                configMapKeyRef:
                  name: graylog-config
                  key: MONGODB_HOST
            - name: MONGODB_PORT
              valueFrom:
                configMapKeyRef:
                  name: graylog-config
                  key: MONGODB_PORT
            - name: MONGODB_DATABASE
              valueFrom:
                configMapKeyRef:
                  name: graylog-config
                  key: MONGODB_DATABASE
            - name: MONGODB_AUTH_SOURCE
              valueFrom:
                configMapKeyRef:
                  name: graylog-config
                  key: MONGODB_AUTH_SOURCE
            - name: MONGO_USER
              valueFrom:
                secretKeyRef:
                  name: graylog-mongodb
                  key: MONGODB_USERNAME
            - name: MONGO_PASS
              valueFrom:
                secretKeyRef:
                  name: graylog-mongodb
                  key: MONGODB_PASSWORD
            - name: GRAYLOG_DATANODE_MONGODB_URI
              value: "mongodb://$(MONGO_USER):$(MONGO_PASS)@$(MONGODB_HOST):$(MONGODB_PORT)/$(MONGODB_DATABASE)?authSource=$(MONGODB_AUTH_SOURCE)"
            # Must equal the server's password_secret.
            - name: GRAYLOG_DATANODE_PASSWORD_SECRET
              valueFrom:
                secretKeyRef:
                  name: graylog
                  key: GRAYLOG_PASSWORD_SECRET
            # Name registered in MongoDB, used by Graylog to connect and put
            # in this node's TLS certificate. Must be resolvable cluster-wide.
            - name: GRAYLOG_DATANODE_HOSTNAME
              value: "$(POD_NAME).graylog-datanode-headless.$(POD_NAMESPACE).svc.cluster.local"
            - name: GRAYLOG_DATANODE_NODE_ID_FILE
              value: /var/lib/graylog-datanode/node-id
            # OpenSearch JVM heap. Keep it <= 50% of the memory limit; the
            # rest is used by the OS file cache, which OpenSearch relies on.
            - name: GRAYLOG_DATANODE_OPENSEARCH_HEAP
              value: "1g"
          readinessProbe:
            tcpSocket:
              port: opensearch
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          # Probe the Data Node API, not OpenSearch: 9200 stays closed until
          # preflight has issued certificates, which can take a while.
          livenessProbe:
            tcpSocket:
              port: api
            initialDelaySeconds: 60
            periodSeconds: 20
            failureThreshold: 6
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
            limits:
              memory: 3Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/graylog-datanode
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        # Change to your cluster's StorageClass if not local-path.
        storageClassName: local-path
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            # Size for your log volume x retention (System -> Indices).
            storage: 50Gi
