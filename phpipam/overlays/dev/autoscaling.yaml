apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: phpipam-web
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: phpipam-web
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: phpipam-web
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: phpipam-web
  updatePolicy:
    updateMode: "Off"