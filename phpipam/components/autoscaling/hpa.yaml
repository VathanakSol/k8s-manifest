apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: phpipam-web
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: phpipam-web
  # >= 2 keeps the UI available during VPA evictions and node drains
  # (the VPA updater also refuses to evict when fewer than 2 replicas run).
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
    scaleDown:
      # Wait 5 min of low load before removing pods to avoid flapping.
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
