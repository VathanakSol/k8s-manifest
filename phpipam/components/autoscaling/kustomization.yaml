# HPA + VPA for phpIPAM.
#
# Division of responsibility (avoids the classic HPA/VPA fight on CPU):
#   - HPA  -> scales phpipam-web replicas horizontally on CPU utilisation.
#   - VPA  -> right-sizes phpipam-web MEMORY only (never CPU), so the HPA's
#             CPU-utilisation math stays stable.
#   - VPA  -> recommendation-only ("Off") for MariaDB and the scheduler:
#             both are singletons, automatic eviction would cause downtime.
#
# Prerequisites in the cluster:
#   - metrics-server            (HPA)
#   - VPA recommender, updater and admission-controller (CRDs alone do nothing)
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - hpa.yaml
  - vpa.yaml
patches:
  # Let the HPA own the replica count. If spec.replicas stayed in the
  # manifest, every `kubectl apply` would reset the web pods to that number
  # (e.g. 5 -> 2 under load) until the HPA scaled them up again.
  - target:
      kind: Deployment
      name: phpipam-web
    patch: |-
      - op: remove
        path: /spec/replicas
