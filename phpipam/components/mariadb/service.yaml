apiVersion: v1
kind: Service
metadata:
  name: phpipam-mariadb-headless
spec:
  clusterIP: None
  selector:
    app: phpipam-mariadb
  ports:
    - name: mysql
      port: 3306
      targetPort: mysql
---
apiVersion: v1
kind: Service
metadata:
  name: phpipam-mariadb
spec:
  type: ClusterIP
  selector:
    app: phpipam-mariadb
  ports:
    - name: mysql
      port: 3306
      targetPort: mysql
