apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - service.yaml
  - statefulset.yaml
# phpIPAM schema, executed by the MariaDB entrypoint on FIRST start only
# (empty data volume). Required because the web installer is disabled.
configMapGenerator:
  - name: phpipam-schema
    files:
      - SCHEMA.sql
patches:
  - target:
      kind: ConfigMap
      name: phpipam-config
    patch: |-
      - op: replace
        path: /data/IPAM_DATABASE_HOST
        value: phpipam-mariadb
      - op: replace
        path: /data/IPAM_DATABASE_PORT
        value: "3306"
