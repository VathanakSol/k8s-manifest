apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: phpipam-mariadb
spec:
  serviceName: phpipam-mariadb-headless
  replicas: 1
  selector:
    matchLabels:
      app: phpipam-mariadb
  template:
    metadata:
      labels:
        app: phpipam-mariadb
    spec:
      automountServiceAccountToken: false
      containers:
        - name: mariadb
          image: mariadb:11.4
          imagePullPolicy: Always
          ports:
            - name: mysql
              containerPort: 3306
          env:
            - name: MARIADB_DATABASE
              valueFrom:
                configMapKeyRef:
                  name: phpipam-config
                  key: IPAM_DATABASE_NAME
            - name: MARIADB_USER
              valueFrom:
                configMapKeyRef:
                  name: phpipam-config
                  key: IPAM_DATABASE_USER
            - name: MARIADB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: phpipam-db
                  key: IPAM_DATABASE_PASS
            - name: MARIADB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: phpipam-mariadb-root
                  key: MARIADB_ROOT_PASSWORD
            - name: MARIADB_ROOT_HOST
              value: localhost
          startupProbe:
            exec:
              command: ["healthcheck.sh", "--connect", "--innodb_initialized"]
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            exec:
              command: ["healthcheck.sh", "--connect", "--innodb_initialized"]
            periodSeconds: 10
            timeoutSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        storageClassName: local-path
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
