apiVersion: apps/v1
kind: Deployment
metadata:
  name: phpipam-scheduler
  labels:
    app: phpipam-scheduler
spec:
  # Must stay at exactly 1: multiple cron pods would run duplicate scans.
  # Not HPA-scaled for that reason.
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: phpipam-scheduler
  template:
    metadata:
      labels:
        app: phpipam-scheduler
    spec:
      automountServiceAccountToken: false
      containers:
        - name: scheduler
          image: phpipam/phpipam-cron:v1.9.1
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: phpipam-config
          env:
            - name: IPAM_DATABASE_PASS
              valueFrom:
                secretKeyRef:
                  name: phpipam-db
                  key: IPAM_DATABASE_PASS
            - name: SCAN_INTERVAL
              value: "1h"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
