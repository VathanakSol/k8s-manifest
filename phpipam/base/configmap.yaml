apiVersion: v1
kind: ConfigMap
metadata:
  name: phpipam-config
data:
  # Replace this with the hostname of your MariaDB server.
  IPAM_DATABASE_HOST: "mariadb.example.internal"
  IPAM_DATABASE_PORT: "3306"
  IPAM_DATABASE_NAME: "phpipam"
  IPAM_DATABASE_USER: "phpipam"
  IPAM_BASE: "/"
  TZ: "Asia/Bangkok"
