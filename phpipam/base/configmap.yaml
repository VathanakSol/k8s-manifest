apiVersion: v1
kind: ConfigMap
metadata:
  name: phpipam-config
data:
  # External MariaDB/MySQL host. Overridden automatically to the in-cluster
  # service when the components/mariadb component is enabled.
  IPAM_DATABASE_HOST: "mariadb.example.internal"
  IPAM_DATABASE_PORT: "3306"
  IPAM_DATABASE_NAME: "phpipam"
  IPAM_DATABASE_USER: "phpipam"
  IPAM_BASE: "/"
  TZ: "Asia/Bangkok"
