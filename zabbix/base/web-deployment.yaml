apiVersion: apps/v1
kind: Deployment
metadata:
  name: zabbix-web
  labels:
    app: zabbix-web
spec:
  # Used only without the autoscaling component. That component removes this
  # field so `kubectl apply` never resets the replica count the HPA has set.
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: zabbix-web
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: zabbix-web
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      # Spread web replicas across nodes so one node failure does not take
      # the UI down. ScheduleAnyway keeps it working on small clusters.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: zabbix-web
      containers:
        - name: zabbix-web
          # Keep the same version as zabbix-server.
          image: zabbix/zabbix-web-nginx-mysql:alpine-7.0.32
          imagePullPolicy: IfNotPresent
          ports:
            # The image runs nginx as non-root on 8080.
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: zabbix-config
          env:
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: zabbix-db
                  key: MYSQL_PASSWORD
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          # TCP only: a DB outage should mark pods unready, not restart them.
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
            failureThreshold: 3
          # HPA scales on CPU utilisation relative to requests.cpu, so the
          # CPU request must be set. VPA (memory only) adjusts memory
          # request/limit proportionally. No CPU limit to avoid throttling.
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              memory: 512Mi
