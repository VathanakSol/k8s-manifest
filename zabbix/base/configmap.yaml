# Shared settings, read by zabbix-server and zabbix-web.
apiVersion: v1
kind: ConfigMap
metadata:
  name: zabbix-config
data:
  # External MariaDB/MySQL host. Overridden automatically to the in-cluster
  # service when the components/mariadb component is enabled.
  DB_SERVER_HOST: "mariadb.example.internal"
  DB_SERVER_PORT: "3306"
  MYSQL_DATABASE: "zabbix"
  MYSQL_USER: "zabbix"
  # Where the web UI finds the Zabbix server (status widget, "Execute now").
  ZBX_SERVER_HOST: "zabbix-server"
  ZBX_SERVER_PORT: "10051"
  ZBX_SERVER_NAME: "Zabbix"
  TZ: "Asia/Bangkok"
  PHP_TZ: "Asia/Bangkok"
---
# Zabbix server tuning (zabbix_server.conf). Each ZBX_<PARAM> env var maps to
# the matching option, e.g. ZBX_CACHESIZE -> CacheSize. Raise these as the
# number of monitored hosts grows; watch the "Zabbix server health" dashboard.
# Keep the caches well below the server container's memory limit.
apiVersion: v1
kind: ConfigMap
metadata:
  name: zabbix-server-config
data:
  ZBX_CACHESIZE: "128M"
  ZBX_HISTORYCACHESIZE: "64M"
  ZBX_HISTORYINDEXCACHESIZE: "16M"
  ZBX_TRENDCACHESIZE: "16M"
  ZBX_VALUECACHESIZE: "64M"
  ZBX_STARTPOLLERS: "10"
  ZBX_STARTPINGERS: "5"
  ZBX_STARTDISCOVERERS: "5"
  ZBX_STARTSNMPPOLLERS: "10"
  ZBX_TIMEOUT: "10"
